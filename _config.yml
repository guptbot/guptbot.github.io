# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "Vedant Gupta"
title_separator          : "-"
name                     : &name "Vedant Gupta"
description              : &description ""
url                      : https://guptbot.github.io
baseurl                  : ""
repository               : "guptbot/guptbot.github.io"

# Site Author - Used in profile and contact pages
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Vedant Gupta"
  bio              : ""
  location         : "San Francisco, CA"
  email            : "vedantgupta@gmail.com"

  # Academic websites
  googlescholar    : "https://scholar.google.com/citations?user=njUX3U0AAAAJ&hl=en"

  # Repositories and software development
  github           : "guptbot"

  # Social media
  twitter          : "@vedant_gupta_16"
  linkedin: vedant2

# Analytics - GoatCounter (privacy-friendly, no cookies)
goatcounter:
  code             : guptbot

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
