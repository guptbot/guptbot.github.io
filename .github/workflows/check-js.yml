name: Check JS Build

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build:js
      - name: Check if JS is up-to-date
        run: |
          if ! git diff --exit-code assets/js/main.min.js; then
            echo "❌ main.min.js is out of date. Run 'npm run build:js' locally."
            exit 1
          fi
          echo "✅ main.min.js is up-to-date"
